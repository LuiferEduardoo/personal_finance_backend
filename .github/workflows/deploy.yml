name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# evita dos despliegues simultáneos
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) build de la imagen y publicación como package en ghcr.io
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nombre de la imagen (minúsculas)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push del package
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2) deploy: SSH al servidor, que descarga el package (docker pull) y reinicia.
  # En el servidor solo vive el .env; la base de datos es externa.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH y desplegar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            CONTAINER=personal_finance_app
            IMAGE="${{ needs.build.outputs.image }}:${{ github.sha }}"
            APP_PORT="${{ secrets.APP_PORT }}"
            APP_PORT="${APP_PORT:-3000}"

            # el servidor se autentica y descarga el package desde ghcr
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"

            # reemplaza el contenedor por el de la imagen nueva
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --env-file .env \
              -e PORT=3000 \
              -p "${APP_PORT}:3000" \
              "$IMAGE"

            # verifica que quedó arriba (el arranque aplica migraciones)
            sleep 10
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "El contenedor no quedó corriendo. Logs:"
              docker logs --tail 50 "$CONTAINER"
              exit 1
            fi
            echo "Desplegado: $IMAGE"

            docker image prune -f
